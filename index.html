// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
let S = null;
let curView = 'leaderboard';

let uploadImg1 = null, uploadImg2 = null, uploadType1 = null, uploadType2 = null;

const defState = () => ({

    manOfSeries:null, mostSixes:null, mostFours:null,

async function waitForFirebase() {
  if (window._fbReady) return;
  return new Promise(res => { window._fbReadyCb = res; });

async function loadS() {

    await waitForFirebase();

// ═══════════════════════════════════════════
// FUZZY NAME MATCHING
// ═══════════════════════════════════════════
function fuzzyMatch(name1, name2) {
  const n1 = name1.toLowerCase().trim();
  const n2 = name2.toLowerCase().trim();
  if (n1 === n2) return true;

  // Check if one is abbreviation of the other: "V Kohli" vs "Virat Kohli"
  const parts1 = n1.split(/\s+/);
  const parts2 = n2.split(/\s+/);

  // Last name must match
  const last1 = parts1[parts1.length - 1];
  const last2 = parts2[parts2.length - 1];
  if (last1 !== last2) return false;

  // First part: initial vs full name
  const first1 = parts1[0];
  const first2 = parts2[0];
  if (first1 === first2) return true;
  if (first1.length === 1 && first2.startsWith(first1)) return true;
  if (first2.length === 1 && first1.startsWith(first2)) return true;

  // Levenshtein distance for close spellings (threshold 2 for names > 5 chars)
  if (n1.length > 5 && n2.length > 5 && levenshtein(n1, n2) <= 2) return true;

  return false;
}

function levenshtein(a, b) {
  const dp = Array.from({length: a.length + 1}, (_, i) =>
    Array.from({length: b.length + 1}, (_, j) => i === 0 ? j : j === 0 ? i : 0)
  );
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] :
        1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[a.length][b.length];
}

function findPlayerInScorecard(name, list) {
  if (!list) return null;
  // Exact first
  const exact = list.find(x => x.name?.toLowerCase().trim() === name.toLowerCase().trim());
  if (exact) return exact;
  // Fuzzy
  return list.find(x => fuzzyMatch(name, x.name || '')) || null;
}
function gid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ═══════════════════════════════════════════
// SCORING ENGINE
// ═══════════════════════════════════════════
function parseOvers(o){
  if(!o) return 0;
  const s=String(o), p=s.split('.');
  return (parseInt(p[0])||0)+(parseInt(p[1])||0)/6;
}

function scoreBatting(b){
  const runs=b.runs||0, balls=b.balls||0, notOut=!!b.isNotOut;
  let pts=0; const bd=[];

  // Duck penalties (only if out)
  if(!notOut && runs===0){
    if(balls===0){ pts-=75; bd.push({l:'Diamond duck 0(0)',p:-75,c:'pen'}); }
    else if(balls===1){ pts-=50; bd.push({l:'Golden duck 0(1)',p:-50,c:'pen'}); }
    else { pts-=30; bd.push({l:'Duck',p:-30,c:'pen'}); }
  }

  // Not out bonus
  if(notOut){ pts+=10; bd.push({l:'Not out',p:10,c:'bat'}); }

  // Runs with multiplier
  let mult=1, flat=0;
  if(runs>=150) mult=4;
  else if(runs>=130) mult=3;
  else if(runs>=100) mult=2;
  else if(runs>=75) flat=50;
  else if(runs>=50) flat=30;
  else if(runs>=30) flat=20;

  if(runs>0){
    const rp=runs*mult;
    pts+=rp;
    if(mult>1) bd.push({l:`${runs} runs ×${mult}`,p:rp,c:'bat'});
    else bd.push({l:`${runs} runs`,p:runs,c:'bat'});
  }
  if(flat>0){
    pts+=flat;
    const fl=runs>=75?'75-99 bonus':runs>=50?'50-74 bonus':'30-49 bonus';
    bd.push({l:fl,p:flat,c:'bat'});
  }

  // SR bonus (min 10 balls)
  if(balls>=10){
    const sr=(runs/balls)*100;
    let sb=0,sl='';
    if(balls>=30&&sr>=250){sb=75;sl=`SR ${sr.toFixed(0)} ≥250`;}
    else if(sr>=200){sb=50;sl=`SR ${sr.toFixed(0)} ≥200`;}
    else if(sr>=180){sb=40;sl=`SR ${sr.toFixed(0)} ≥180`;}
    else if(sr>=150){sb=30;sl=`SR ${sr.toFixed(0)} ≥150`;}
    if(sb>0){pts+=sb;bd.push({l:sl,p:sb,c:'bat'});}
  }
  return{pts,bd};
}

function scoreBowling(b){
  const wk=b.wickets||0, runs=b.runs||0, overs=b.overs||'0';
  const maidens=b.maidens||0, wMaidens=b.wicketMaidens||0, hattrick=!!b.hasHattrick;
  const ov=parseOvers(overs);
  let pts=0; const bd=[];

  // Wickets
  const base=wk*30;
  let mult=1, flat=0;
  if(wk>=7) mult=4;
  else if(wk>=6) mult=3;
  else if(wk>=5) mult=2;
  else if(wk>=4) flat=50;
  else if(wk>=3) flat=30;

  if(wk>0){
    const wp=base*mult;
    pts+=wp;
    if(mult>1) bd.push({l:`${wk} wickets ×${mult}`,p:wp,c:'bowl'});
    else bd.push({l:`${wk} wicket${wk>1?'s':''}`,p:base,c:'bowl'});
    if(flat>0){pts+=flat;bd.push({l:`${wk}W bonus`,p:flat,c:'bowl'});}
  }

  // Maidens / wicket maidens
  const regM=Math.max(0,maidens-wMaidens);
  if(wMaidens>0){pts+=wMaidens*100;bd.push({l:`${wMaidens} wicket maiden`,p:wMaidens*100,c:'bowl'});}
  if(regM>0){pts+=regM*50;bd.push({l:`${regM} maiden`,p:regM*50,c:'bowl'});}
  if(hattrick){pts+=200;bd.push({l:'Hat-trick!',p:200,c:'bowl'});}

  // Economy (min 2 overs)
  if(ov>=2){
    const eco=ov>0?runs/ov:99;
    let eb=0,el='';
    if(ov>=3&&eco<=2.7){eb=75;el=`Eco ${eco.toFixed(2)} ≤2.7`;}
    else if(eco<=3.5){eb=50;el=`Eco ${eco.toFixed(2)} ≤3.5`;}
    else if(eco<=5.0){eb=40;el=`Eco ${eco.toFixed(2)} ≤5.0`;}
    else if(eco<=5.5){eb=30;el=`Eco ${eco.toFixed(2)} ≤5.5`;}
    if(eb>0){pts+=eb;bd.push({l:el,p:eb,c:'bowl'});}
  }

  // Runs conceded penalty
  if(runs>=65){pts-=75;bd.push({l:`${runs} runs conceded`,p:-75,c:'pen'});}
  else if(runs>=55){pts-=50;bd.push({l:`${runs} runs conceded`,p:-50,c:'pen'});}
  else if(runs>=50){pts-=30;bd.push({l:`${runs} runs conceded`,p:-30,c:'pen'});}

  return{pts,bd};
}

function scoreFielding(f){
  const catches=f.catches||0, st=f.stumpings||0, ro=f.runOuts||0;
  let pts=0; const bd=[];
  if(catches>0){pts+=catches*10;bd.push({l:`${catches} catch`,p:catches*10,c:'field'});}
  if(st>0){pts+=st*10;bd.push({l:`${st} stumping`,p:st*10,c:'field'});}
  if(ro>0){pts+=ro*10;bd.push({l:`${ro} run out`,p:ro*10,c:'field'});}
  return{pts,bd};
}

function applyRole(pts, isC, isVC){
  if(isC) return Math.round(pts*2);
  if(isVC) return Math.round(pts*1.5);
  return pts;
}

function calcPlayerTotal(pdata, isC=false, isVC=false){
  let base=0; let bd=[];
  if(pdata.batting){ const r=scoreBatting(pdata.batting); base+=r.pts; bd.push(...r.bd); }
  if(pdata.bowling){ const r=scoreBowling(pdata.bowling); base+=r.pts; bd.push(...r.bd); }
  if(pdata.fielding){ const r=scoreFielding(pdata.fielding); base+=r.pts; bd.push(...r.bd); }
  const final=applyRole(base,isC,isVC);
  const bonus=final-base;
  if(bonus>0){
    if(isC) bd.push({l:'Captain ×2',p:bonus,c:'role'});
    else if(isVC) bd.push({l:'VC ×1.5',p:bonus,c:'role'});
  }
  return{pts:final,bd};
}

function processTeamMatch(team, sc, matchId){
  let total=0; const players=[];
  for(const rp of team.players){
    const bat = findPlayerInScorecard(rp.name, sc.batting);
    const bowl = findPlayerInScorecard(rp.name, sc.bowling);
    const field = findPlayerInScorecard(rp.name, sc.fielding);
    if(!bat&&!bowl&&!field) continue;
    const pd={};
    if(bat) pd.batting=bat;
    if(bowl) pd.bowling=bowl;
    if(field) pd.fielding=field;
    const isC=team.currentCaptain===rp.name;
    const isVC=team.currentVc===rp.name;
    const{pts,bd}=calcPlayerTotal(pd,isC,isVC);
    total+=pts;
    players.push({name:rp.name,isC,isVC,pts,bd});
  }
  // MOM
  const mom=sc.match?.mom;
  if(mom){
    const hasMom=team.players.some(p=>p.name.toLowerCase()===mom.toLowerCase().trim());
    if(hasMom){
      const mt=sc._matchType||'league';
      const mp=mt==='final'?100:mt==='semifinal'?75:50;
      total+=mp;
      players.push({name:mom,isC:false,isVC:false,pts:mp,bd:[{l:`MOM (${mt})`,p:mp,c:'bonus'}]});
    }
  }
  // Prediction
  const pred=team.predictions?.[matchId];
  if(pred&&pred.correct!==undefined){
    const pp=pred.correct?30:-20;
    total+=pp;
    players.push({name:'Prediction',isC:false,isVC:false,pts:pp,bd:[{l:pred.correct?'Correct prediction':'Wrong prediction',p:pp,c:'pred'}]});
  }
  return{total,players};
}

// ═══════════════════════════════════════════
// TEAM POINTS (incl. awards + swap penalties)
// ═══════════════════════════════════════════
function teamTotal(team){
  let t=0;
  for(const m of S.matches){
    if(m.completed && m.teamScores?.[team.id]) t+=m.teamScores[team.id].total||0;
  }
  // Wrong swap penalties
  const wrongSwaps=(team.swaps?.history||[]).filter(s=>s.isWrong).length;
  t+=wrongSwaps*(-300);
  // Awards
  const a=S.awards;
  if(a.orangeCap===team.id) t+=200;
  if(a.secondRuns===team.id) t+=150;
  if(a.purpleCap===team.id) t+=200;
  if(a.secondWickets===team.id) t+=150;
  if(a.manOfSeries===team.id) t+=250;
  if(a.mostSixes===team.id) t+=100;
  if(a.mostFours===team.id) t+=100;
  if(a.standings?.first===team.id) t+=300;
  if(a.standings?.second===team.id) t+=250;
  if(a.standings?.third===team.id) t+=200;
  if(a.standings?.fourth===team.id) t+=150;
  return t;
}

function handleImg(inp, num){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    const b64=e.target.result.split(',')[1]; const mime=f.type;
    if(num===1){uploadImg1=b64;uploadType1=mime;document.getElementById('upv1').innerHTML=`✅ ${f.name}`;}
    else{uploadImg2=b64;uploadType2=mime;document.getElementById('upv2').innerHTML=`✅ ${f.name}`;}
  };
  r.readAsDataURL(f);
}

const PARSE_PROMPT=`You are a cricket scorecard parser. Return ONLY valid raw JSON, no markdown, no explanation.

Schema:
{
  "match":{"team1":"","team2":"","winner":"short name","mom":"player name"},
  "batting":[{"name":"","team":"","runs":0,"balls":0,"fours":0,"sixes":0,"strikeRate":0.0,"isNotOut":false,"dismissal":""}],
  "bowling":[{"name":"","team":"","overs":"4.0","maidens":0,"wicketMaidens":0,"runs":0,"wickets":0,"economy":0.0,"hasHattrick":false}],
  "fielding":[{"name":"","catches":0,"stumpings":0,"runOuts":0}]
}

RULES:
- If two innings images are provided, merge both batting and bowling arrays into one combined list
- Extract fielding from dismissal strings: "c X b Y" = catch by X, "st X b Y" = stumping by X, "run out (X/Y)" = run out, assign runOuts:1 to every player listed
- wicketMaidens = overs where bowler took wicket AND conceded 0 runs
- DO NOT include super over data
- wins: look for "won by" or result text
- MOM: look for "Player of the match" or "man of the match"`;

async function doParseAI(){
  if(!checkAdmin('parse a match')) return;
  const txt=document.getElementById('sct')?.value.trim();
  const mn=document.getElementById('mn')?.value.trim();
  const mtype=document.getElementById('mt')?.value;
  const mdate=document.getElementById('md')?.value;
  const hasImages=uploadImg1||uploadImg2;
  if(!txt&&!hasImages){alert('Paste scorecard text or upload at least one screenshot');return;}
  const btn=document.getElementById('pbt');
  if(btn)btn.innerHTML='<span class="spinner"></span> Parsing…';
  let userContent;
  if(hasImages){
    userContent=[];
    if(uploadImg1) userContent.push({type:'image',source:{type:'base64',media_type:uploadType1,data:uploadImg1}});
    if(uploadImg2) userContent.push({type:'image',source:{type:'base64',media_type:uploadType2,data:uploadImg2}});
    const note=uploadImg1&&uploadImg2?'Two innings screenshots: Image 1 = first innings, Image 2 = second innings. Merge both into one combined JSON.':'One innings screenshot provided.';
    userContent.push({type:'text',text:txt?note+'\nAdditional text:\n'+txt:note});
  } else { userContent=txt; }
  if(!WORKER_URL || WORKER_URL.startsWith('PASTE')){
    if(btn)btn.innerHTML='🤖 Parse with AI';
    alert('❌ Worker URL not set.\n\nOpen index.html and paste your Cloudflare Worker URL into WORKER_URL at the top of the script.');
    return;
  }
  try{
    const res=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:3000,system:PARSE_PROMPT,messages:[{role:'user',content:userContent}]})
    });
    const data=await res.json();
    const raw=data.content?.[0]?.text||'';
    const clean=raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    const parsed=JSON.parse(clean);
    pendingSC={...parsed,_matchName:mn,_matchType:mtype,_matchDate:mdate};
    uploadImg1=null;uploadImg2=null;uploadType1=null;uploadType2=null;
    render();
  }catch(e){
    if(btn)btn.innerHTML='🤖 Parse with AI';
    alert('Parse failed: '+e.message+'\n\nTry again or check your scorecard format.');
  }
}

function clearPending(){pendingSC=null;uploadImg1=null;uploadImg2=null;render();}

async function submitMatch(){
  if(!checkAdmin('save a match')) return;
  if(!pendingSC) return;
  const winner=document.getElementById('ewinner')?.value||pendingSC.match?.winner||'';
  const mom=document.getElementById('emom')?.value||pendingSC.match?.mom||'';

  // Find existing upcoming match record
  let matchRec=S.matches.find(m=>m.id===scorecardMatchId);
  if(!matchRec){
    matchRec={id:gid(),name:'Unknown Match',type:'league',date:'',teamScores:{}};
    S.matches.push(matchRec);
  }
  matchRec.winner=winner;
  matchRec.mom=mom;
  matchRec.completed=true;
  matchRec.rawScorecard=pendingSC;
  matchRec.teamScores={};

  for(const t of S.teams){
    const cap=document.getElementById(`mc-${t.id}`)?.value||t.currentCaptain;
    const vc=document.getElementById(`mvc-${t.id}`)?.value||t.currentVc;
    const isWin=document.getElementById(`mw-${t.id}`)?.checked;
    const isAb=document.getElementById(`mab-${t.id}`)?.checked;
    const prevC=t.currentCaptain, prevVC=t.currentVc;
    t.currentCaptain=cap; t.currentVc=vc;
    const sc={...pendingSC,match:{...pendingSC.match,winner,mom},id:matchRec.id};
    const{total,players}=processTeamMatch(t,sc,matchRec.id);
    t.currentCaptain=prevC; t.currentVc=prevVC;
    let extra=0,extraP=[];
    if(isAb){extra+=40;extraP.push({name:'Match abandoned',pts:40,bd:[{l:'Abandoned +40',p:40,c:'bonus'}]});}
    else if(isWin){extra+=75;extraP.push({name:'Winning team',pts:75,bd:[{l:'Win bonus +75',p:75,c:'bonus'}]});}
    matchRec.teamScores[t.id]={total:total+extra,captain:cap,vc,players:[...players,...extraP]};
    t.currentCaptain=cap; t.currentVc=vc;
  }

  // Auto-mark predictions correct/wrong
  for(const t of S.teams){
    if(t.predictions?.[matchRec.id]){
      t.predictions[matchRec.id].correct=
        t.predictions[matchRec.id].prediction?.toLowerCase()===winner?.toLowerCase();
    }
  }

  pendingSC=null;
  addView='menu';
  scorecardMatchId=null;
  await saveS();
  nav('matches');
  alert(`✅ Scores saved for "${matchRec.name}"! Predictions marked automatically.`);
}

const FORMATION = { Batsman:4, 'All-rounder':2, 'Wicket-keeper':1, Bowler:4 };
const FLEX_ROLES = {
  'All-rounder': ['Batsman','Bowler','All-rounder'],
  'Wicket-keeper': ['Batsman','Wicket-keeper']
};

function validateFormation(players) {
  // Count by role, applying flex rules
  const slots = { Batsman:0, 'All-rounder':0, 'Wicket-keeper':0, Bowler:0 };
  for (const p of players) {
    const r = p.role;
    if (slots[r] !== undefined) slots[r]++;
  }
  const errors = [];
  for (const [role, needed] of Object.entries(FORMATION)) {
    if (slots[role] !== needed) errors.push(`Need ${needed} ${role}(s), have ${slots[role]}`);
  }
  return errors;
}

function formationStatus(players) {
  const slots = { Batsman:0, 'All-rounder':0, 'Wicket-keeper':0, Bowler:0 };
  for (const p of players) if (slots[p.role] !== undefined) slots[p.role]++;
  return slots;
}

function hasMatchStarted() {
  return S.matches.length > 0;
}

async function addPlayer(tid){
  if(!checkAdmin('add a player')) return;
  const name=document.getElementById('ap-name')?.value.trim();
  const iplTeam=document.getElementById('ap-team')?.value;
  const role=document.getElementById('ap-role')?.value;
  const isCap=document.getElementById('ap-iscap')?.checked;
  const isVc=document.getElementById('ap-isvc')?.checked;
  if(!name){alert('Player name required');return;}
  if(!role){alert('Select a role');return;}
  const t=S.teams.find(x=>x.id===tid);if(!t)return;
  if(t.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){alert('Player already in team');return;}

  // Formation check — will adding this role exceed the slot?
  const f=formationStatus(t.players);
  if((f[role]||0) >= FORMATION[role]){
    alert(`Formation full for ${role} (max ${FORMATION[role]}). Choose a different role.`);return;
  }

  t.players.push({id:gid(),name,iplTeam,role});
  if(isCap || (!t.currentCaptain)) t.currentCaptain=name;

// VIEW: SWAPS
// ═══════════════════════════════════════════
// Rules:
//   - 1 FREE daily swap per match day (if 2 games that day → 2 free swaps)
//   - Free swaps do NOT count against the 15 season total
//   - 15 PAID player swaps total across the season
//   - 5 captain swaps, 5 VC swaps (season total, no daily free for C/VC)
//   - Wrong swap = −300 pts

function getMatchDates() {
  // Returns map: dateStr → array of match ids
  const map = {};
  for (const m of S.matches) {
    if (!m.date) continue;
    if (!map[m.date]) map[m.date] = [];
    map[m.date].push(m.id);
  }
  return map;
}

function getDailyFreeSwapsUsed(team) {
  // Count free swaps used per date
  const used = {};
  for (const h of (team.swaps?.history || [])) {
    if (h.isFree && h.matchDate) {
      used[h.matchDate] = (used[h.matchDate] || 0) + 1;
    }
  }
  return used;
}

function getDailyFreeSwapsAllowed(dateStr) {
  // Number of games on that date = number of free swaps allowed
  const dateMap = getMatchDates();
  return (dateMap[dateStr] || []).length;
}

function canUseFreeSwap(team, dateStr) {
  if (!dateStr) return false;
  const allowed = getDailyFreeSwapsAllowed(dateStr);
  if (allowed === 0) return false;
  const usedMap = getDailyFreeSwapsUsed(team);
  return (usedMap[dateStr] || 0) < allowed;
}

async function logSwap(tid){
  if(!checkAdmin('log a swap')) return;
  const t=S.teams.find(x=>x.id===tid);if(!t)return;
  const type=document.getElementById('sw-type')?.value;
  const from=document.getElementById('sw-from')?.value;
  // For C/VC swaps, read from sw-to-role; for player swaps read from sw-to
  const to=(type==='player'
    ? document.getElementById('sw-to')?.value.trim()
    : document.getElementById('sw-to-role')?.value.trim());
  const newRoleRaw=document.getElementById('sw-newrole')?.value;
  const mid=document.getElementById('sw-match')?.value;
  const isWrong=document.getElementById('sw-wrong')?.checked;
  const wantFree=document.getElementById('sw-free')?.checked;
  if(!to){alert('Enter the player being swapped in');return;}
  if(!t.swaps)t.swaps={player:0,captain:0,vc:0,history:[]};

  const todayStr=new Date().toISOString().split('T')[0];
  const matchDate=S.matches.find(m=>m.id===mid)?.date||todayStr;

  // Formation check for player swaps
  if(type==='player' && !isWrong){
    const outPlayer=t.players.find(p=>p.name===from);
    const outRole=outPlayer?.role;
    const newRole=newRoleRaw||outRole;
    if(!newRole){alert('Could not determine role — select role for new player.');return;}
    // Temporarily simulate the swap
    const tempPlayers=t.players.filter(p=>p.name!==from).concat([{name:to,role:newRole}]);
    const errs=validateFormation(tempPlayers);
    if(errs.length && !isWrong){
      const proceed=confirm(`⚠️ Formation warning:\n${errs.join('\n')}\n\nThis will be marked as a WRONG swap (−300 pts). Proceed?`);
      if(!proceed)return;
      // force wrong
      document.getElementById('sw-wrong').checked=true;
    }
  }

  const isWrongFinal=document.getElementById('sw-wrong')?.checked;

  // Free swap eligibility
  let isFree=false;
  if(!isWrongFinal && type==='player' && wantFree){
    if(canUseFreeSwap(t,matchDate)) isFree=true;
    else{alert(`No free swaps left for ${matchDate}.`);return;}
  }

  // Season limits
  const limits={player:15,captain:5,vc:5};
  if(!isWrongFinal && !isFree){
    if((t.swaps[type]||0)>=limits[type]){alert(`No ${type} swaps remaining this season!`);return;}
    t.swaps[type]=(t.swaps[type]||0)+1;
  }

  const mname=S.matches.find(m=>m.id===mid)?.name||'Next match';
  const outPlayer=t.players.find(p=>p.name===from);
  const newRole=newRoleRaw||outPlayer?.role||'';
  t.swaps.history.push({type,from,to,match:mname,matchId:mid,matchDate,isFree,isWrong:isWrongFinal,date:new Date().toISOString(),newRole});

  if(!isWrongFinal){
    if(type==='player'){
      t.players=t.players.filter(p=>p.name!==from);
      t.players.push({id:gid(),name:to,iplTeam:outPlayer?.iplTeam||'',role:newRole});
      if(t.currentCaptain===from)t.currentCaptain=to;
      if(t.currentVc===from)t.currentVc=to;
    } else if(type==='captain'){t.currentCaptain=to;}
    else if(type==='vc'){t.currentVc=to;}
  }
  await saveS();closeModal('swap-modal');render();
}

async function saveEditedScores(matchId, teamId){
  const m=S.matches.find(x=>x.id===matchId);
  const scores=m?.teamScores?.[teamId];
  if(!scores) return;

  // Update player pts
  for(const p of (scores.players||[])){
    const inp=document.getElementById(`ep-${p.name.replace(/\s/g,'_')}`);
    if(inp) p.pts=parseInt(inp.value)||p.pts;
  }
  // Recalculate total from players OR use override

  const overrideTotal=totalInp?parseInt(totalInp.value):NaN;
  if(!isNaN(overrideTotal)){

  } else {
    scores.total=(scores.players||[]).reduce((a,p)=>a+p.pts,0);
  }
  await saveS();closeModal('edit-score-modal');render();
  alert('✅ Scores updated.');
}

// --- Reverse a swap ---
async function reverseSwap(tid, swapIdx){
  if(!checkAdmin('reverse a swap')) return;
  const t=S.teams.find(x=>x.id===tid);if(!t)return;
  const h=t.swaps?.history;if(!h||swapIdx<0||swapIdx>=h.length)return;
  const sw=h[swapIdx];
  if(!confirm(`Reverse swap: ${sw.from||sw.type} → ${sw.to}?\nThis will undo the roster change and refund the swap.`)) return;

  // Undo roster
  if(!sw.isWrong){
    if(sw.type==='player'){
      t.players=t.players.filter(p=>p.name!==sw.to);
      if(sw.from) t.players.push({id:gid(),name:sw.from,iplTeam:'',role:sw.outRole||''});
    } else if(sw.type==='captain'){t.currentCaptain=sw.from||t.currentCaptain;}
    else if(sw.type==='vc'){t.currentVc=sw.from||t.currentVc;}
    // Refund counter
    if(!sw.isFree && t.swaps[sw.type]>0) t.swaps[sw.type]--;
  }
  h.splice(swapIdx,1);
  await saveS();render();
  alert('✅ Swap reversed.');
}

// --- Reverse a prediction ---
async function reversePred(tid, mid){
  if(!checkAdmin('reverse a prediction')) return;
  const t=S.teams.find(x=>x.id===tid);if(!t)return;
  if(!t.predictions?.[mid]){alert('No prediction found.');return;}
  if(!confirm('Clear this prediction?')) return;
  delete t.predictions[mid];
  await saveS();render();
}
