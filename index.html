<script>

async function waitForFirebase() {

function fuzzyMatch(name1, name2) {
  const n1 = name1.toLowerCase().trim();
  const n2 = name2.toLowerCase().trim();
  if (n1 === n2) return true;
  const parts1 = n1.split(/\s+/);
  const parts2 = n2.split(/\s+/);
  const last1 = parts1[parts1.length - 1];
  const last2 = parts2[parts2.length - 1];
  if (last1 !== last2) return false;
  const first1 = parts1[0];
  const first2 = parts2[0];
  if (first1 === first2) return true;
  if (first1.length === 1 && first2.startsWith(first1)) return true;
  if (first2.length === 1 && first1.startsWith(first2)) return true;
  if (n1.length > 5 && n2.length > 5 && levenshtein(n1, n2) <= 2) return true;
  return false;
}

function levenshtein(a, b) {
  const dp = Array.from({length: a.length + 1}, (_, i) =>
    Array.from({length: b.length + 1}, (_, j) => i === 0 ? j : j === 0 ? i : 0)
  );
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] :
        1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[a.length][b.length];
}

function findPlayerInScorecard(name, list) {
  if (!list) return null;
  const exact = list.find(x => x.name?.toLowerCase().trim() === name.toLowerCase().trim());
  if (exact) return exact;
  return list.find(x => fuzzyMatch(name, x.name || '')) || null;
}
function gid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function parseOvers(o){
  if(!o) return 0;
  const s=String(o), p=s.split('.');
  return (parseInt(p[0])||0)+(parseInt(p[1])||0)/6;
}

// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
function scoreBatting(b){
  const runs=b.runs||0, balls=b.balls||0, notOut=!!b.isNotOut;
  let pts=0; const bd=[];

  // Duck penalties
  if(!notOut && runs===0){
    if(balls===0){pts-=75;bd.push({l:'Diamond duck 0(0)',p:-75,c:'pen'});}
    else if(balls===1){pts-=50;bd.push({l:'Golden duck 0(1)',p:-50,c:'pen'});}
    else{pts-=30;bd.push({l:'Duck',p:-30,c:'pen'});}
  }

  // Not out bonus
  if(notOut){pts+=10;bd.push({l:'Not out +10',p:10,c:'bat'});}

  // Run scoring: 1 run = 1 pt, with multiplier at 100/130/150
  if(runs>0){
    let mult=1;
    if(runs>=150) mult=4;
    else if(runs>=130) mult=3;
    else if(runs>=100) mult=2;
    const rp=runs*mult;
    pts+=rp;
    if(mult>1) bd.push({l:`${runs} runs ×${mult}`,p:rp,c:'bat'});
    else bd.push({l:`${runs} runs`,p:runs,c:'bat'});
  }

  // Flat batting bonuses
  let flat=0,fl='';
  if(runs>=100) flat=0; // already handled by multiplier, no additional flat
  else if(runs>=75){flat=50;fl='75-99 bonus +50';}
  else if(runs>=50){flat=30;fl='50-74 bonus +30';}
  else if(runs>=30){flat=20;fl='30-49 bonus +20';}
  if(flat>0){pts+=flat;bd.push({l:fl,p:flat,c:'bat'});}

  // Strike rate bonus (min 10 balls)
  if(balls>=10){
    const sr=(runs/balls)*100;
    let sb=0,sl='';
    if(balls>=25&&sr>=250){sb=75;sl=`SR ${sr.toFixed(0)} ≥250 (25+ balls) +75`;}
    else if(sr>=225){sb=50;sl=`SR ${sr.toFixed(0)} ≥225 +50`;}
    else if(sr>=200){sb=40;sl=`SR ${sr.toFixed(0)} ≥200 +40`;}
    else if(sr>=180){sb=30;sl=`SR ${sr.toFixed(0)} ≥180 +30`;}
    else if(sr>=150){sb=20;sl=`SR ${sr.toFixed(0)} ≥150 +20`;}
    if(sb>0){pts+=sb;bd.push({l:sl,p:sb,c:'bat'});}
  }

  return{pts,bd};
}

function scoreBowling(b){
  const wk=b.wickets||0, runs=b.runs||0, overs=b.overs||'0';
  const maidens=b.maidens||0, wMaidens=b.wicketMaidens||0, hattrick=!!b.hasHattrick;
  const ov=parseOvers(overs);
  let pts=0; const bd=[];

  // Wicket points: 1 wicket = 25 pts, with multiplier at 5/6/7+
  if(wk>0){
    const base=wk*25;
    let mult=1, flat=0;
    if(wk>=7){mult=4;}
    else if(wk>=6){mult=3;}
    else if(wk>=5){mult=2;}
    else if(wk>=4){flat=50;}
    else if(wk>=3){flat=30;}
    const wp=base*mult;
    pts+=wp;
    if(mult>1) bd.push({l:`${wk} wickets ×${mult}`,p:wp,c:'bowl'});
    else bd.push({l:`${wk} wicket${wk>1?'s':''}`,p:base,c:'bowl'});
    if(flat>0){pts+=flat;bd.push({l:`${wk}W bonus +${flat}`,p:flat,c:'bowl'});}
  }

  // Maidens
  const regM=Math.max(0,maidens-wMaidens);
  if(wMaidens>0){pts+=wMaidens*100;bd.push({l:`${wMaidens} wicket maiden`,p:wMaidens*100,c:'bowl'});}
  if(regM>0){pts+=regM*75;bd.push({l:`${regM} maiden`,p:regM*75,c:'bowl'});}

  // Hat-trick
  if(hattrick){pts+=200;bd.push({l:'Hat-trick! +200',p:200,c:'bowl'});}

  // Economy bonus (min 2 overs)
  if(ov>=2){
    const eco=runs/ov;
    let eb=0,el='';
    if(ov>=3&&eco<=2.7){eb=75;el=`Eco ${eco.toFixed(2)} ≤2.7 (3+ ov) +75`;}
    else if(eco<=3.5){eb=50;el=`Eco ${eco.toFixed(2)} ≤3.5 +50`;}
    else if(eco<=4.0){eb=40;el=`Eco ${eco.toFixed(2)} ≤4.0 +40`;}
    else if(eco<=5.0){eb=30;el=`Eco ${eco.toFixed(2)} ≤5.0 +30`;}
    else if(eco<=5.5){eb=20;el=`Eco ${eco.toFixed(2)} ≤5.5 +20`;}
    if(eb>0){pts+=eb;bd.push({l:el,p:eb,c:'bowl'});}
  }

  // Runs conceded penalties
  if(runs>=70){pts-=75;bd.push({l:`${runs} runs conceded −75`,p:-75,c:'pen'});}
  else if(runs>=65){pts-=50;bd.push({l:`${runs} runs conceded −50`,p:-50,c:'pen'});}
  else if(runs>=60){pts-=30;bd.push({l:`${runs} runs conceded −30`,p:-30,c:'pen'});}
  else if(runs>=55){pts-=20;bd.push({l:`${runs} runs conceded −20`,p:-20,c:'pen'});}

  return{pts,bd};
}

function scoreFielding(f){
  const catches=f.catches||0, st=f.stumpings||0, ro=f.runOuts||0;
  let pts=0; const bd=[];
  if(catches>0){pts+=catches*10;bd.push({l:`${catches} catch`,p:catches*10,c:'field'});}
  if(st>0){pts+=st*10;bd.push({l:`${st} stumping`,p:st*10,c:'field'});}
  if(ro>0){pts+=ro*10;bd.push({l:`${ro} run out`,p:ro*10,c:'field'});}
  return{pts,bd};
}

function applyRole(pts, isC, isVC, isSuperSub=false){
  if(isSuperSub){
    if(isC) return Math.round(pts*4);   // Super Sub Captain = 4x
    if(isVC) return Math.round(pts*3.5); // Super Sub VC = 3.5x
    return Math.round(pts*3);            // Super Sub Normal = 3x
  }
  if(isC) return Math.round(pts*2);
  if(isVC) return Math.round(pts*1.5);
  return pts;
}

function calcPlayerTotal(pdata, isC=false, isVC=false, isSuperSub=false){
  let base=0; const bd=[];
  if(pdata.batting){const r=scoreBatting(pdata.batting);base+=r.pts;bd.push(...r.bd);}
  if(pdata.bowling){const r=scoreBowling(pdata.bowling);base+=r.pts;bd.push(...r.bd);}
  if(pdata.fielding){const r=scoreFielding(pdata.fielding);base+=r.pts;bd.push(...r.bd);}
  const final=applyRole(base,isC,isVC,isSuperSub);
  const bonus=final-base;
  if(bonus>0){
    if(isSuperSub&&isC) bd.push({l:'⚡ Super Sub Captain ×4',p:bonus,c:'super'});
    else if(isSuperSub&&isVC) bd.push({l:'⚡ Super Sub VC ×3.5',p:bonus,c:'super'});
    else if(isSuperSub) bd.push({l:'⚡ Super Sub ×3',p:bonus,c:'super'});
    else if(isC) bd.push({l:'Captain ×2',p:bonus,c:'role'});
    else if(isVC) bd.push({l:'VC ×1.5',p:bonus,c:'role'});
  }
  return{pts:final,bd};
}

function processTeamMatch(team, sc, matchId){
  let total=0; const players=[];
  // Get super sub for this team in this match
  const match=S.matches.find(m=>m.id===matchId);
  const superSubName=match?.superSubs?.[team.id]||null;

  for(const rp of team.players){
    const bat = findPlayerInScorecard(rp.name, sc.batting);
    const bowl = findPlayerInScorecard(rp.name, sc.bowling);
    const field = findPlayerInScorecard(rp.name, sc.fielding);
    if(!bat&&!bowl&&!field) continue;
    const pd={};
    if(bat) pd.batting=bat;
    if(bowl) pd.bowling=bowl;
    if(field) pd.fielding=field;
    const isC=team.currentCaptain===rp.name;
    const isVC=team.currentVc===rp.name;
    const isSuperSub=!!superSubName && rp.name.toLowerCase()===superSubName.toLowerCase();
    const{pts,bd}=calcPlayerTotal(pd,isC,isVC,isSuperSub);
    total+=pts;
    players.push({name:rp.name,isC,isVC,isSuperSub,pts,bd});
  }
  const mom=sc.match?.mom;
  if(mom){
    const hasMom=team.players.some(p=>p.name.toLowerCase()===mom.toLowerCase().trim());
    if(hasMom){
      const mt=sc._matchType||'league';
      const mp=mt==='final'?100:mt==='semifinal'?75:50;
      total+=mp;
      players.push({name:mom,isC:false,isVC:false,isSuperSub:false,pts:mp,bd:[{l:`MOM (${mt})`,p:mp,c:'bonus'}]});
    }
  }
  const pred=team.predictions?.[matchId];
  if(pred && pred.prediction && pred.correct!==undefined){
    const pp=pred.correct?30:-20;
    total+=pp;
    players.push({name:'Prediction',isC:false,isVC:false,isSuperSub:false,pts:pp,bd:[{l:pred.correct?'Correct prediction':'Wrong prediction',p:pp,c:'pred'}]});
  }
  return{total,players};
}

function teamTotal(team){
  let t=0;
  for(const m of S.matches){
    if(m.completed && m.teamScores?.[team.id]) t+=m.teamScores[team.id].total||0;
  }
  const wrongSwaps=(team.swaps?.history||[]).filter(s=>s.isWrong).length;
  t+=wrongSwaps*(-200);
  // Formation penalty — wrong formation costs -200 pts
  if(team.players.length===11){
    const formErrs=validateFormation(team.players);
    if(formErrs.length>0) t-=200;
  }
  const a=S.awards;
  const mult=k=>{const r=a.multipliers?.[k]||'none';return r==='captain'?2:r==='vc'?1.5:1;};
  // Season awards — with C/VC multiplier
  if(a.orangeCap===team.id)        t+=Math.round(150*mult('orangeCap'));
  if(a.secondRuns===team.id)       t+=Math.round(100*mult('secondRuns'));
  if(a.purpleCap===team.id)        t+=Math.round(150*mult('purpleCap'));
  if(a.secondWickets===team.id)    t+=Math.round(100*mult('secondWickets'));
  if(a.manOfSeries===team.id)      t+=Math.round(200*mult('manOfSeries'));
  if(a.emergingPlayer===team.id)   t+=Math.round(100*mult('emergingPlayer'));
  if(a.mostGreenDots===team.id)    t+=Math.round(100*mult('mostGreenDots'));
  if(a.bestCatch===team.id)        t+=Math.round(100*mult('bestCatch'));
  if(a.mostSixes===team.id)        t+=Math.round(100*mult('mostSixes'));
  if(a.mostFours===team.id)        t+=Math.round(100*mult('mostFours'));
  // Final standings — no multiplier
  if(a.standings?.first===team.id)   t+=300;
  if(a.standings?.second===team.id)  t+=250;
  if(a.standings?.third===team.id)   t+=200;
  if(a.standings?.fourth===team.id)  t+=150;
  return t;
}

function nav(v){
  curView=v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  document.querySelectorAll('#nav-drawer-inner button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  render();
}
function render(){
  const app=document.getElementById('app');
  if(!app) return;
  switch(curView){
    case 'leaderboard': app.innerHTML=vLeaderboard(); break;
    case 'matches': app.innerHTML=vMatches(); break;
    case 'points': app.innerHTML=vPoints(); break;
    case 'add': app.innerHTML=isAdmin?vAdd():'<div class="empty"><div class="icon">🔒</div><h2>Admin only</h2></div>'; break;
    case 'teams': app.innerHTML=vTeams(); break;
    case 'squad': app.innerHTML=vSquad(); break;
    case 'swaps': app.innerHTML=vSwaps(); break;
    case 'predictions': app.innerHTML=vPredictions(); break;
    case 'awards': app.innerHTML=isAdmin?vAwards():'<div class="empty"><div class="icon">🔒</div><h2>Admin only</h2></div>'; break;
    default: app.innerHTML=vLeaderboard();
  }
}

          const r=i+1, rCls=r<=3?`rank-${r}`:'', medal=r===1?'🥇':r===2?'🥈':r===3?'🥉':r;
          const avg=t.played>0?Math.round(t.tot/t.played):0;
          return`<tr>
            <td><span class="${rCls}" style="font-weight:700">${medal}</span></td>

function lastMatchWidget(){
  const m=S.matches[S.matches.length-1]; if(!m) return '';
  const sc=Object.entries(m.teamScores||{}).map(([id,s])=>({team:S.teams.find(t=>t.id===id),s})).filter(x=>x.team).sort((a,b)=>b.s.total-a.s.total);
  return`<div class="card"><div class="fb mb12"><h2>Last: ${m.name}</h2><span class="badge b-blue">${m.date||''}</span></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px">
    ${sc.map(({team,s})=>`<div class="panel" style="text-align:center"><div class="small muted">${team.name}</div><div class="hl" style="font-size:18px;font-weight:700">${s.total}</div></div>`).join('')}
  </div></div>`;
}

function vMatches(){
  const completed=S.matches.filter(m=>m.completed);

  return`<div class="fb mb16"><h1>Match History</h1>${isAdmin?'<button class="btn btn-primary btn-sm" onclick="nav(\'add\')">Match Manager</button>':''}</div>

}

    <div class="fb mb12">

      <div class="fc g8"><span class="muted small">${m.date||''}</span>${isAdmin?`<button class="btn btn-danger btn-xs" onclick="delMatch('${m.id}')">Delete</button>`:''}</div>
    </div>
    ${m.winner?`<div class="alert al-success mb12">🏆 Winner: <strong>${m.winner}</strong>${m.mom?` &nbsp;|&nbsp; MOM: <strong>${m.mom}</strong>`:''}</div>`:''}
    <div class="tscroll"><table>
      <thead><tr><th>Team</th><th>C/VC</th><th>Top Player</th><th>Points</th><th></th></tr></thead>
      <tbody>
        ${sc.map(({team,s})=>{
          const top=(s.players||[]).filter(p=>p.name!=='Prediction'&&p.name!=='Winning team'&&p.name!=='Match').sort((a,b)=>b.pts-a.pts)[0];
          const hasOverride=(s.overrides||[]).length>0;
          return`<tr>
            <td style="font-weight:600">${team.name}</td>

            <td><span class="hl" style="font-weight:700;font-size:15px">${s.total}</span>${hasOverride?` <span class="badge b-orange" title="${(s.overrides||[]).map(o=>o.note).join(' | ')}" style="font-size:10px;cursor:help">✏️ edited</span>`:''}</td>

          </tr>

            </div>

    </table></div>
  </div>`;
}

    ${players.map(p=>`<tr>
      <td>${p.name}${p.isC?' <span class="badge b-gold">C</span>':''}${p.isVC?' <span class="badge b-blue">VC</span>':''}${p.isSuperSub?' <span class="badge b-orange" style="background:rgba(249,115,22,0.25);color:#fb923c">⚡SS</span>':''}</td>

// CRICBUZZ TEXT PARSER (auto-detect format)
// ═══════════════════════════════════════════
function doParseText(){
  if(!checkAdmin('parse scorecard')) return;
  const txt=document.getElementById('sct')?.value.trim();
  const winner=document.getElementById('tp-winner')?.value?.trim()||'';
  const mom=document.getElementById('tp-mom')?.value?.trim()||'';
  if(!txt){alert('Paste the scorecard text first.');return;}

  try{
    // Auto-detect format
    const fmt=detectFormat(txt);
    const result = fmt==='espn' ? parseESPNText(txt) : fmt==='tab' ? parseTabText(txt) : parseCricbuzzText(txt);
    const existingMatch=S.matches.find(x=>x.id===scorecardMatchId);
    if(result.batting.length===0 && result.bowling.length===0){
      alert('Could not parse any player data.\n\nSupports Cricbuzz, ESPNcricinfo, and Cricinfo tab formats. Make sure you copied the full scorecard including both innings.');
      return;
    }
    pendingSC={
      match:{team1:result.team1||'',team2:result.team2||'',winner:winner||result.winner||'',mom:mom||result.mom||''},
      batting:result.batting, bowling:result.bowling, fielding:result.fielding,
      matchName:existingMatch?.name||'', matchType:existingMatch?.type||'league', matchDate:existingMatch?.date||''
    };
    render();
  }catch(e){
    alert('Parse error: '+e.message);
  }
}

function detectFormat(txt){
  const lines=txt.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  let tabHits=0, espnHits=0, cricbuzzHits=0;
  for(const line of lines){
    // Tab format: line of all numbers separated by tabs (batting stats row)
    if(/^\d+\t\d+\t\d+\t\d+\t\d+\t[\d.]+$/.test(line)) tabHits++;
    // Tab format: bowling with tabs
    if(/^\d[\d.]*\t\d\t\d/.test(line)) tabHits++;
    // ESPN format: dismissal text + digits + decimal all on one line
    if(/^(not\s+out|b\s+|c\s+|lbw|run\s+out|st\s+|retired).+\d+\.\d{2}$/i.test(line)) espnHits++;
    if(/^\d{5,}\.\d{2}\d+$/.test(line)) espnHits++;
    // Cricbuzz format: standalone single number lines
    if(/^\d{1,3}$/.test(line)) cricbuzzHits++;
  }
  if(tabHits>=2) return 'tab';
  if(espnHits>=2) return 'espn';
  return 'cricbuzz';
}

// ═══════════════════════════════════════════
// TAB-SEPARATED PARSER (Cricinfo website copy-paste)
// Batting: Name / Dismissal / R TAB B TAB M TAB 4s TAB 6s TAB SR
// Bowling: Name / O TAB M TAB R TAB W TAB ECO TAB 0s TAB WD TAB NB
//   (with edge cases: W on separate line, R W ECO space-merged)
// ═══════════════════════════════════════════
function parseTabText(txt){
  const rawLines=txt.split('\n').map(l=>l.trimEnd()).filter(l=>l.trim().length>0);
  const lines=rawLines.map(l=>({raw:l.trim(),parts:l.trim().split('\t').map(p=>p.trim()).filter(p=>p.length>0)}));
  const batting=[], bowling=[], fielding=[];
  const fieldMap={};
  let winner='', mom='';

  for(const {raw} of lines){
    const low=raw.toLowerCase();
    if(low.includes('player of the match')||low.includes('man of the match')){
      const p=raw.split(/[:\-\u2013]/);if(p.length>1) mom=p[p.length-1].trim();
    }
    if(low.includes('won by')){const wm=raw.match(/^(.+?)\s+won\s+by/i);if(wm) winner=wm[1].trim();}
  }

  const isNumericStr=s=>/^[\d.]+$/.test(s.trim());
  const DISM=[/^not\s+out$/i,/^c\s+/i,/^st\s+/i,/^b\s+/i,/^lbw\b/i,
    /^run\s+out/i,/^hit\s+wicket/i,/^retired/i,/^obstructing/i,/^timed\s+out/i];
  const isDismissal=s=>DISM.some(p=>p.test(s.trim()));

  const isSkip=l=>{
    const t=l.toLowerCase().trim();
    if(['batting','bowling','fall of wickets','extras','total','did not bat','yet to bat','drs','batter','bowler'].some(s=>t===s||t.startsWith(s+'\t'))) return true;
    if(/^(r|b|m|4s|6s|sr|o|w|eco|econ|0s|wd|nb)(\t|$)/i.test(t)) return true;
    if(t.startsWith('total ')||t.startsWith('extras ')||t.startsWith('fall of')) return true;
    if(/^\d+(\.\d+)?\s+ov/i.test(t)||/\(.*ovs?\s+maximum\)/i.test(t)) return true;
    if(/^(t:|batting\s+r)/i.test(t)) return true;
    if(/^\(.*\)$/.test(t)) return true;
    return false;
  };

  function parseBowlJoined(partsArr){
    const tokens=partsArr.join(' ').split(/\s+/).filter(t=>t.length>0);
    if(tokens.length<5) return null;
    let ecoIdx=-1;
    for(let j=0;j<tokens.length;j++){
      if(/^\d{1,2}\.\d{2}$/.test(tokens[j])){
        const v=parseFloat(tokens[j]);
        if(v>=0&&v<=25){ecoIdx=j;break;}
      }
    }
    if(ecoIdx<0) return null;
    const before=tokens.slice(0,ecoIdx);
    if(before.length<4) return null;
    const W=parseInt(before[before.length-1]);
    const R=parseInt(before[before.length-2]);
    const M=parseInt(before[before.length-3]);
    const O=before[before.length-4];
    const eco=parseFloat(tokens[ecoIdx]);
    if(isNaN(W)||isNaN(R)||isNaN(M)||!O) return null;
    if(R>150||M>6||W>10) return null;
    return{overs:O,maidens:M,runs:R,wickets:W,economy:eco};
  }

  let i=0;
  while(i<lines.length){
    const {raw,parts}=lines[i];
    if(isSkip(raw)){i++;continue;}
    if(parts.length!==1||isNumericStr(raw)||isSkip(raw)){i++;continue;}
    const name=raw.replace(/[\u2020\u271D]/g,'').replace(/\s*\(c\)|\s*\(wk\)/gi,'').trim();
    if(name.length<2){i++;continue;}
    if(i+1>=lines.length){i++;continue;}
    const next=lines[i+1];

    // BATTING A: dismissal line then 6-part stats
    if(next.parts.length===1&&isDismissal(next.raw)&&i+2<lines.length){
      const statsLine=lines[i+2];
      if(statsLine.parts.length===6&&isNumericStr(statsLine.parts[0])){
        const sp=statsLine.parts;
        const dismissal=next.raw.replace(/[\u2020\u271D]/g,'').trim();
        batting.push({name,team:'',runs:parseInt(sp[0])||0,balls:parseInt(sp[1])||0,
          fours:parseInt(sp[3])||0,sixes:parseInt(sp[4])||0,
          strikeRate:parseFloat(sp[5])||0,isNotOut:/not\s*out/i.test(dismissal),dismissal});
        extractFielding(dismissal,fieldMap);
        i+=3;continue;
      }
    }

    // BATTING B: "not out\tR\tB\tM\t4s\t6s\tSR" (7 parts)
    if(next.parts.length>=7&&/^not\s+out$/i.test(next.parts[0])&&isNumericStr(next.parts[1])){
      const sp=next.parts;
      batting.push({name,team:'',runs:parseInt(sp[1])||0,balls:parseInt(sp[2])||0,
        fours:parseInt(sp[4])||0,sixes:parseInt(sp[5])||0,
        strikeRate:parseFloat(sp[6])||0,isNotOut:true,dismissal:'not out'});
      i+=2;continue;
    }

    // BOWLING A: normal 8-part line
    if(next.parts.length===8&&isNumericStr(next.parts[0])){
      const bp=parseBowlJoined(next.parts);
      if(bp){bowling.push({name,team:'',overs:bp.overs,maidens:bp.maidens,wicketMaidens:0,
        runs:bp.runs,wickets:bp.wickets,economy:bp.economy,hasHattrick:false});i+=2;continue;}
    }

    // BOWLING B: split W — "O\tM\tR" then lone W then "ECO\t0s\tWD\tNB"
    if(next.parts.length===3&&isNumericStr(next.parts[0])&&i+3<lines.length){
      const wLine=lines[i+2],ecoLine=lines[i+3];
      if(wLine.parts.length===1&&isNumericStr(wLine.raw)&&ecoLine.parts.length>=3){
        const bp=parseBowlJoined([...next.parts,wLine.raw,...ecoLine.parts]);
        if(bp){bowling.push({name,team:'',overs:bp.overs,maidens:bp.maidens,wicketMaidens:0,
          runs:bp.runs,wickets:bp.wickets,economy:bp.economy,hasHattrick:false});i+=4;continue;}
      }
    }

    // BOWLING C: space-merged (e.g. "4\t0\t26 3 6.50\t13\t1\t0")
    if(next.parts.length>=4&&next.parts.length<=7&&isNumericStr(next.parts[0].split(/\s/)[0])){
      const bp=parseBowlJoined(next.parts);
      if(bp){bowling.push({name,team:'',overs:bp.overs,maidens:bp.maidens,wicketMaidens:0,
        runs:bp.runs,wickets:bp.wickets,economy:bp.economy,hasHattrick:false});i+=2;continue;}
    }

    i++;
  }

  for(const fn in fieldMap)
    if(fieldMap.hasOwnProperty(fn))
      fielding.push({name:fn,catches:fieldMap[fn].catches,stumpings:fieldMap[fn].stumpings,runOuts:fieldMap[fn].runOuts});

  return{team1:'',team2:'',winner,mom,batting,bowling,fielding};
}

// ═══════════════════════════════════════════
// ESPNcricinfo PARSER
// Batting line: "dismissal_text + R + B + M + 4s + 6s + SR" (all on one line)
// Bowling line: "O + M + R + W + ECO + N0s + WD + NB" (pure digits+decimal)
// Player name is on the line BEFORE the stats line
// ═══════════════════════════════════════════
function parseESPNText(txt){
  const raw=txt.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const batting=[], bowling=[], fielding=[];
  const fieldMap={};
  let winner='', mom='';

  // Detect MOM/winner
  for(const line of raw){
    const low=line.toLowerCase();
    if(low.includes('player of the match')||low.includes('man of the match')){
      const p=line.split(/[:\-–]/);if(p.length>1) mom=p[p.length-1].trim();
    }
    if(low.includes('won by')){const wm=line.match(/^(.+?)\s+won\s+by/i);if(wm) winner=wm[1].trim();}
  }

  const SKIP_LINES=['batting','bowling','fall of wickets','extras','total','did not bat','yet to bat','drs',
    'r','b','m','4s','6s','sr','o','w','eco','n0s','wd','nb','batter','bowler'];
  const isSkip=l=>SKIP_LINES.includes(l.toLowerCase())||l.toLowerCase().startsWith('total ')||
    l.toLowerCase().startsWith('extras ')||l.toLowerCase().startsWith('fall of')||
    l.toLowerCase().startsWith('did not bat')||l.toLowerCase().startsWith('bowling')||
    l.toLowerCase().startsWith('batting ')||/^\d+(\.\d+)?\s+ov/i.test(l)||/^batting\s+r/i.test(l);

  // ESPN batting stats line detector
  const isBatStatsLine=l=>/^(not\s+out|b\s+|c\s+|lbw|run\s+out|st\s+|retired|hit\s+wicket|timed|obstr).+\d+\.\d{2}$/i.test(l);
  // ESPN bowling stats line detector: pure digits + 1 decimal
  const isBowlStatsLine=l=>/^\d+\.\d{2}\d*$/.test(l)||/^\d{4,}\.\d{2}/.test(l);

  for(let i=0;i<raw.length;i++){
    const line=raw[i];
    if(isSkip(line)) continue;

    // Check if next line is batting stats
    if(i+1<raw.length && isBatStatsLine(raw[i+1])){
      const name=line.replace(/[†✝]/g,'').replace(/\s*\(c\)|\s*\(wk\)/gi,'').trim();
      if(name.length<2||isSkip(line)){i++;continue;}
      const statsLine=raw[i+1];
      const parsed=parseESPNBatLine(statsLine);
      if(parsed){
        batting.push({name,team:'',runs:parsed.R,balls:parsed.B,fours:parsed.fours,sixes:parsed.sixes,
          strikeRate:parsed.sr,isNotOut:parsed.isNotOut,dismissal:parsed.dismissal});
        extractFielding(parsed.dismissal,fieldMap);
        i++;continue;
      }
    }

    // Check if next line is bowling stats
    if(i+1<raw.length && isBowlStatsLine(raw[i+1])){
      const name=line.replace(/[†✝]/g,'').replace(/\s*\(c\)|\s*\(wk\)/gi,'').trim();
      if(name.length<2||isSkip(line)){i++;continue;}
      const parsed=parseESPNBowlLine(raw[i+1]);
      if(parsed){
        bowling.push({name,team:'',overs:parsed.overs,maidens:parsed.maidens,wicketMaidens:0,
          runs:parsed.runs,wickets:parsed.wickets,economy:parsed.eco,hasHattrick:false});
        i++;continue;
      }
    }
  }

  for(const fn in fieldMap)
    if(fieldMap.hasOwnProperty(fn))
      fielding.push({name:fn,catches:fieldMap[fn].catches,stumpings:fieldMap[fn].stumpings,runOuts:fieldMap[fn].runOuts});

  return{team1:'',team2:'',winner,mom,batting,bowling,fielding};
}

function parseESPNBatLine(statsLine){
  const dotIdx=statsLine.lastIndexOf('.');
  if(dotIdx<0) return null;
  let srStart=dotIdx-1, srIntLen=0;
  while(srStart>=0 && /\d/.test(statsLine[srStart]) && srIntLen<3){srStart--;srIntLen++;}
  srStart++;
  const sr=parseFloat(statsLine.slice(srStart));
  const nums=statsLine.slice(0,srStart).replace(/\D/g,'');
  if(!nums) return null;

  const dismissal=statsLine.slice(0,srStart).replace(/\d/g,'').replace(/[†✝]/g,'').replace(/\s*\(c\)|\s*\(wk\)/gi,'').trim();
  const isNotOut=/not\s*out/i.test(dismissal);

  // Duck handling (sr=0 or all-zero stats)
  if(sr===0){
    const nonZero=nums.replace(/0/g,'');
    if(!nonZero||nums.length<=3){
      const B=nums.length>=2?parseInt(nums[1])||0:0;
      return{R:0,B,M:0,fours:0,sixes:0,sr:0,dismissal,isNotOut};
    }
  }

  let best=null, bestScore=Infinity;
  for(let s6=1;s6<=2;s6++) for(let s4=1;s4<=2;s4++) for(let sm=1;sm<=3;sm++) for(let sb=1;sb<=3;sb++){
    const tl=s6+s4+sm+sb, rl=nums.length-tl;
    if(rl<1||rl>3||tl>=nums.length) continue;
    const R=parseInt(nums.slice(0,rl)), B=parseInt(nums.slice(rl,rl+sb));
    const M=parseInt(nums.slice(rl+sb,rl+sb+sm)), fours=parseInt(nums.slice(rl+sb+sm,rl+sb+sm+s4));
    const sixes=parseInt(nums.slice(rl+sb+sm+s4));
    if(B>120||M>180||fours>25||sixes>25||R>250) continue;
    if(B===0&&R>0) continue;
    if(B>0&&sr>0){const c=(R/B)*100;if(Math.abs(c-sr)/sr>0.15) continue;}
    const score=B>0?Math.abs((R/B*100)-sr):0;
    if(score<bestScore){bestScore=score;best={R,B,M,fours,sixes,sr,dismissal,isNotOut};}
  }
  return best;
}

function parseESPNBowlLine(line){
  const dotIdx=line.indexOf('.');
  if(dotIdx<0) return null;
  const ecoFrac=line.slice(dotIdx+1,dotIdx+3);
  if(!/^\d{2}$/.test(ecoFrac)) return null;
  for(let il=2;il>=1;il--){
    if(dotIdx<il) continue;
    const ecoInt=line.slice(dotIdx-il,dotIdx);
    if(!/^\d+$/.test(ecoInt)) continue;
    const eco=parseFloat(ecoInt+'.'+ecoFrac);
    if(eco<0||eco>25) continue;
    const before=line.slice(0,dotIdx-il);
    const bm=before.match(/^(\d{1})(\d{1})(\d{1,3})(\d{1})$/);
    if(!bm) continue;
    const O=bm[1],M=parseInt(bm[2]),R=parseInt(bm[3]),W=parseInt(bm[4]);
    const overs=parseFloat(O);
    if(overs<0.1||overs>5||M>5||R>99||W>10) continue;
    if(overs>0&&eco>0&&Math.abs(R/overs-eco)/eco>0.15) continue;
    return{overs:O,maidens:M,runs:R,wickets:W,eco};
  }
  return null;
}

function parseCricbuzzText(txt){
  // Cricbuzz uses multi-line format for BOTH batting and bowling.
  // Batting: Name / Dismissal / R / B / 4s / 6s / SR  (7 lines per player)
  // Bowling: Name / O / M / R / W / NB / WD / ECO     (8 lines per player)
  // Header rows like "Batter","R","B","4s","6s","SR","Bowler","O","M","R","W","NB","WD","ECO" are skipped.

  const raw=txt.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const batting=[], bowling=[], fielding=[];
  const fieldMap={};
  let winner='', mom='';

  // Detect MOM / winner anywhere in text
  for(const line of raw){
    const low=line.toLowerCase();
    if(low.includes('player of the match')||low.includes('man of the match')){
      const parts=line.split(/[:\-–]/);if(parts.length>1) mom=parts[parts.length-1].trim();
    }
    if(low.includes('won by')){
      const wm=line.match(/^(.+?)\s+won\s+by/i);if(wm) winner=wm[1].trim();
    }
  }

  const isNumeric=s=>/^[\d.]+$/.test(s.trim());
  const isInt=s=>/^\d+$/.test(s.trim());

  // Header lines to skip
  const SKIP=['batter','bowler','r','b','4s','6s','sr','o','m','w','nb','wd','eco','extras',
              'total','fall of wickets','did not bat','yet to bat','partnership'];
  const isSkip=s=>SKIP.includes(s.toLowerCase().trim())||
    s.toLowerCase().startsWith('total ')||s.toLowerCase().startsWith('extras ')||
    s.toLowerCase().startsWith('fall of')||s.toLowerCase().startsWith('did not bat')||
    s.toLowerCase().startsWith('yet to bat');

  // Dismissal patterns
  const DISM=[/^not\s+out$/i,/^c\s+/i,/^st\s+/i,/^b\s+/i,/^lbw\b/i,
              /^run\s+out/i,/^hit\s+wicket/i,/^retired/i,/^obstructing/i,/^timed\s+out/i];
  const isDismissal=s=>DISM.some(p=>p.test(s.trim()));

  // Also handle single-line formats (tab or multi-space separated)
  // Batting: "Name  dismissal  R  B  4s  6s  SR"
  // Bowling: "Name  O  M  R  W  Eco" or "Name  O  M  R  W  NB  WD  Eco"
  const singleLineBowlRe=/^(.+?)\s{2,}([\d.]+)\s+(\d+)\s+(\d+)\s+(\d+)(?:\s+\d+\s+\d+)?\s+([\d.]+)\s*$/;
  const singleLineBowlTab=/^(.+?)\t([\d.]+)\t(\d+)\t(\d+)\t(\d+)(?:\t\d+\t\d+)?\t([\d.]+)\s*$/;

  const usedLines=new Set();

  // ── PASS 1: detect single-line bowling (tab/multi-space) ──
  for(let i=0;i<raw.length;i++){
    const m=raw[i].match(singleLineBowlRe)||raw[i].match(singleLineBowlTab);
    if(!m) continue;
    const name=m[1].replace(/[†✝]/g,'').replace(/\s*\(c\)|\s*\(wk\)/gi,'').trim();
    if(name.length<2||isNumeric(name)||isSkip(name)) continue;
    bowling.push({name,team:'',overs:m[2],maidens:parseInt(m[3])||0,wicketMaidens:0,
      runs:parseInt(m[4])||0,wickets:parseInt(m[5])||0,economy:parseFloat(m[6])||0,hasHattrick:false});
    usedLines.add(i);
  }

  // ── PASS 2: detect multi-line bowling ──
  // Pattern: Name / O / M / R / W / NB / WD / ECO (8 lines)
  // O is like "4" or "3.2" (can have decimal), M/R/W/NB/WD are integers, ECO is decimal
  for(let i=0;i<raw.length-7;i++){
    if(usedLines.has(i)||isSkip(raw[i])||isNumeric(raw[i])) continue;
    const name=raw[i].replace(/[†✝]/g,'').replace(/\s*\(c\)|\s*\(wk\)/gi,'').trim();
    if(name.length<2) continue;
    // Check lines i+1..i+7: O M R W NB WD ECO
    const o=raw[i+1], m=raw[i+2], r=raw[i+3], w=raw[i+4], nb=raw[i+5], wd=raw[i+6], eco=raw[i+7];
    if(isNumeric(o) && isInt(m) && isInt(r) && isInt(w) && isInt(nb) && isInt(wd) && isNumeric(eco)){
      // Extra check: overs should be reasonable (0-24), wickets 0-10
      const oNum=parseFloat(o), wNum=parseInt(w);
      if(oNum>=0 && oNum<=24 && wNum>=0 && wNum<=10){
        bowling.push({name,team:'',overs:o,maidens:parseInt(m)||0,wicketMaidens:0,
          runs:parseInt(r)||0,wickets:wNum,economy:parseFloat(eco)||0,hasHattrick:false});
        for(let k=i;k<=i+7;k++) usedLines.add(k);
        i+=7; // skip ahead
        continue;
      }
    }
  }

  // ── PASS 3: detect multi-line batting ──
  // Pattern: Name / Dismissal / R / B / 4s / 6s / SR (7 lines)
  for(let i=0;i<raw.length;i++){
    if(usedLines.has(i)||isSkip(raw[i])||isNumeric(raw[i])) continue;
    const nameLine=raw[i];
    const name=nameLine.replace(/[†✝]/g,'').replace(/\s*\(c\)|\s*\(wk\)/gi,'').trim();
    if(name.length<2) continue;

    // Case A: next line is dismissal, then R B 4s 6s SR
    if(i+6<raw.length && isDismissal(raw[i+1]) && isInt(raw[i+2]) && isInt(raw[i+3])){
      const dismissal=raw[i+1].trim();
      const isNotOut=/not\s*out/i.test(dismissal);
      const runs=parseInt(raw[i+2])||0;
      const balls=parseInt(raw[i+3])||0;
      const fours=parseInt(raw[i+4])||0;
      const sixes=parseInt(raw[i+5])||0;
      const sr=parseFloat(raw[i+6])||0;
      batting.push({name,team:'',runs,balls,fours,sixes,strikeRate:sr,isNotOut,dismissal});
      extractFielding(dismissal,fieldMap);
      for(let k=i;k<=i+6;k++) usedLines.add(k);
      i+=6; continue;
    }

    // Case B: name has inline dismissal on same line ("de Kock  c X b Y"), then R B 4s 6s SR
    const inlineDism=nameLine.match(/^(.+?)\s{2,}((?:c\s+|st\s+|b\s+|lbw\b|run\s*out|not\s*out|retired|hit\s*wicket).+)$/i);
    if(inlineDism && i+5<raw.length && isInt(raw[i+1]) && isInt(raw[i+2])){
      const cleanName=inlineDism[1].replace(/[†✝]/g,'').replace(/\s*\(c\)|\s*\(wk\)/gi,'').trim();
      const dismissal=inlineDism[2].trim();
      const isNotOut=/not\s*out/i.test(dismissal);
      const runs=parseInt(raw[i+1])||0;
      const balls=parseInt(raw[i+2])||0;
      const fours=parseInt(raw[i+3])||0;
      const sixes=parseInt(raw[i+4])||0;
      const sr=parseFloat(raw[i+5])||0;
      batting.push({name:cleanName,team:'',runs,balls,fours,sixes,strikeRate:sr,isNotOut,dismissal});
      extractFielding(dismissal,fieldMap);
      for(let k=i;k<=i+5;k++) usedLines.add(k);
      i+=5; continue;
    }
  }

  // Build fielding array from fieldMap
  for(const fn in fieldMap){
    if(fieldMap.hasOwnProperty(fn)){
      fielding.push({name:fn,catches:fieldMap[fn].catches,stumpings:fieldMap[fn].stumpings,runOuts:fieldMap[fn].runOuts});
    }
  }

  return{team1:'',team2:'',winner,mom,batting,bowling,fielding};
}

function extractFielding(dismissal,fieldMap){
  if(!dismissal) return;
  const cMatch=dismissal.match(/^c\s+(.+?)\s+b\s+/i);
  if(cMatch){const fn=cMatch[1].replace(/[†✝]/g,'').replace(/\s*\(c\)|\s*\(wk\)/gi,'').trim();if(fn&&fn.toLowerCase()!=='sub'&&fn.length>1){if(!fieldMap[fn])fieldMap[fn]={catches:0,stumpings:0,runOuts:0};fieldMap[fn].catches++;}}
  const stMatch=dismissal.match(/^st\s+(.+?)\s+b\s+/i);
  if(stMatch){const fn=stMatch[1].replace(/[†✝]/g,'').replace(/\s*\(c\)|\s*\(wk\)/gi,'').trim();if(fn&&fn.length>1){if(!fieldMap[fn])fieldMap[fn]={catches:0,stumpings:0,runOuts:0};fieldMap[fn].stumpings++;}}
  const roMatch=dismissal.match(/run\s*out\s*\(([^)]+)\)/i);
  if(roMatch){roMatch[1].split('/').forEach(n=>{const fn=n.replace(/[†✝]/g,'').trim();if(fn&&fn.length>1){if(!fieldMap[fn])fieldMap[fn]={catches:0,stumpings:0,runOuts:0};fieldMap[fn].runOuts++;}});}
}

function parsedBowlTable(rows){

    ${rows.map(b=>`<tr><td>${b.name}</td><td class="muted">${b.team||''}</td><td>${b.overs}</td><td>${b.maidens||0}</td><td>${b.runs}</td><td><strong>${b.wickets}</strong></td><td>${b.economy||0}</td><td>${b.hasHattrick?'<span class="badge b-purple">HT</span>':''}${(b.wicketMaidens||0)>0?'<span class="badge b-orange">WM</span>':''}</td></tr>`).join('')}

function parsedFieldTable(rows){

const PARSE_PROMPT=`IMPORTANT: Output ONLY raw JSON. Your response must start with { and end with }. No explanation, no markdown, no "Here's", no code fences. Any character before { will break the parser. You are a cricket scorecard parser. Return ONLY valid raw JSON...

Schema:
{
  "match":{"team1":"","team2":"","winner":"short name","mom":"player name"},
  "batting":[{"name":"","team":"","runs":0,"balls":0,"fours":0,"sixes":0,"strikeRate":0.0,"isNotOut":false,"dismissal":""}],
  "bowling":[{"name":"","team":"","overs":"4.0","maidens":0,"wicketMaidens":0,"runs":0,"wickets":0,"economy":0.0,"hasHattrick":false}],
  "fielding":[{"name":"","catches":0,"stumpings":0,"runOuts":0}]
}

RULES:
- If two innings images are provided, merge both batting and bowling arrays into one combined list
- Extract fielding from dismissal strings: "c X b Y" = catch by X, "st X b Y" = stumping by X, "run out (X/Y)" = run out, assign runOuts:1 to every player listed
- wicketMaidens = overs where bowler took wicket AND conceded 0 runs
- DO NOT include super over data
- wins: look for "won by" or result text
- MOM: look for "Player of the match" or "man of the match"`;

function extractJSON(str) {
  const objIdx = str.indexOf('{');
  const arrIdx = str.indexOf('[');
  let start = -1;
  if (objIdx === -1 && arrIdx === -1) throw new Error('No JSON object found in model response');
  if (objIdx === -1) start = arrIdx;
  else if (arrIdx === -1) start = objIdx;
  else start = Math.min(objIdx, arrIdx);

  const open = str[start], close = open === '{' ? '}' : ']';
  let depth = 0, inStr = false, esc = false;

  for (let i = start; i < str.length; i++) {
    const c = str[i];
    if (esc) { esc = false; continue; }
    if (c === '\\' && inStr) { esc = true; continue; }
    if (c === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (c === open) depth++;
    if (c === close) { depth--; if (depth === 0) return JSON.parse(str.slice(start, i + 1)); }
  }
  throw new Error('JSON in model response was incomplete or malformed');
}

// ─── FIX #1: Use WORKER_URL constant instead of placeholder ───
// ─── FIX #2: Use PARSE_PROMPT (correct variable name) ─────────

async function doParseAI() {
  if (!checkAdmin('parse a match')) return;

  const txt = document.getElementById('sct')?.value.trim();
  const hasImages = uploadImg1 || uploadImg2;

  if (!txt && !hasImages) { alert('Paste scorecard text or upload at least one screenshot'); return; }

  const btn = document.getElementById('pbt');
  if (btn) btn.innerHTML = '<span class="spinner"></span> Parsing...';

  let userContent;
  if (hasImages) {
    userContent = [];
    if (uploadImg1) userContent.push({ type: 'image', source: { type: 'base64', media_type: uploadType1, data: uploadImg1 } });
    if (uploadImg2) userContent.push({ type: 'image', source: { type: 'base64', media_type: uploadType2, data: uploadImg2 } });
    const note = (uploadImg1 && uploadImg2)
      ? 'Two innings screenshots. Image 1 = first innings, Image 2 = second innings. Merge both into one combined JSON.'
      : 'One innings screenshot provided.';
    userContent.push({ type: 'text', text: txt ? `${note}\n${txt}` : note });
  } else {
    userContent = txt;
  }

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: PARSE_PROMPT, messages: [{ role: 'user', content: userContent }] })
    });

    const data = await res.json();
    const raw = data.content?.[0]?.text || '';

    if (raw.startsWith('API_ERROR') || raw.startsWith('WORKER_ERROR')) {
      throw new Error(raw);
    }

    const parsed = extractJSON(raw);

    // Get match metadata from the existing match record
    const existingMatch = S.matches.find(x => x.id === scorecardMatchId);
    pendingSC = {
      ...parsed,
      matchName: existingMatch?.name || '',
      matchType: existingMatch?.type || 'league',
      matchDate: existingMatch?.date || ''
    };
    uploadImg1 = null; uploadImg2 = null; uploadType1 = null; uploadType2 = null;
    render();

  } catch (e) {
    if (btn) btn.innerHTML = '🤖 Parse with AI';
    alert('Parse failed: ' + e.message);
  }
} // ← FIX #3: This closing brace was missing

async function submitMatch(){
  if(!checkAdmin('save a match')) return;
  if(!pendingSC) return;
  const winner=document.getElementById('ewinner')?.value||pendingSC.match?.winner||'';
  const mom=document.getElementById('emom')?.value||pendingSC.match?.mom||'';

  let matchRec=S.matches.find(m=>m.id===scorecardMatchId);
  if(!matchRec){
    matchRec={id:gid(),name:'Unknown Match',type:'league',date:'',teamScores:{}};
    S.matches.push(matchRec);
  }
  matchRec.winner=winner;
  matchRec.mom=mom;
  matchRec.completed=true;
  matchRec.rawScorecard=pendingSC;
  matchRec.teamScores={};

  for(const t of S.teams){
    const cap=t.currentCaptain;
    const vc=t.currentVc;
    // Auto win bonus: if this fantasy team's IPL team matches the match winner
    const isWin = t.iplTeam && winner && t.iplTeam.toLowerCase()===winner.toLowerCase();
    const isAb=document.getElementById(`mab-${t.id}`)?.checked;
    const sc={...pendingSC,match:{...pendingSC.match,winner,mom},id:matchRec.id};
    const{total,players}=processTeamMatch(t,sc,matchRec.id);
    let extra=0,extraP=[];
    if(isAb){extra+=40;extraP.push({name:'Match abandoned',pts:40,bd:[{l:'Abandoned +40',p:40,c:'bonus'}]});}
    else if(isWin){extra+=75;extraP.push({name:`${t.iplTeam} won +75`,pts:75,bd:[{l:`${t.iplTeam} win bonus +75`,p:75,c:'bonus'}]});}
    matchRec.teamScores[t.id]={total:total+extra,captain:cap,vc,players:[...players,...extraP]};
  }

  for(const t of S.teams){
    if(t.predictions?.[matchRec.id]){
      t.predictions[matchRec.id].correct=
        t.predictions[matchRec.id].prediction?.toLowerCase()===winner?.toLowerCase();
    }
  }

  pendingSC=null;
  addView='menu';
  scorecardMatchId=null;
  await saveS();
  nav('matches');
  alert(`✅ Scores saved for "${matchRec.name}"! C: used each team's current captain.`);
}

async function saveSuperSubs(matchId){
  if(!checkAdmin('save super subs')) return;
  const m=S.matches.find(x=>x.id===matchId);
  if(!m) return;
  if(!m.superSubs) m.superSubs={};

  for(const t of S.teams){
    const sel=document.getElementById(`ss-${t.id}`);
    if(!sel) continue;
    const newSS=sel.value||'';
    const oldSS=m.superSubs[t.id]||'';

    if(newSS===oldSS) continue; // no change

    if(newSS && !oldSS){
      // Using a super sub — check if team has uses left
      if(!t.superSubsUsed) t.superSubsUsed=0;
      if(t.superSubsUsed>=2){
        alert(`${t.name} has already used both Super Subs this season.`);
        continue;
      }
      m.superSubs[t.id]=newSS;
      t.superSubsUsed=(t.superSubsUsed||0)+1;
    } else if(!newSS && oldSS){
      // Removing a super sub — refund the use
      delete m.superSubs[t.id];
      if(t.superSubsUsed>0) t.superSubsUsed--;
    } else if(newSS && oldSS){
      // Changing which player is super sub — no extra cost
      m.superSubs[t.id]=newSS;
    }
  }
  await saveS();
  closeModal('supersub-modal');
  render();
  alert('✅ Super Subs saved!');
}

async function importSquadXlsx(inp,tid){
  if(!checkAdmin('import squad')) return;
  const file=inp.files[0]; if(!file) return;
  inp.value='';
  // Determine which fantasy team this import is for
  const t=tid?S.teams.find(x=>x.id===tid):S.teams.find(x=>x.id===squadViewTeam);
  try{
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!rows.length){alert('No rows found in xlsx');return;}
    if(!S.squad) S.squad=[];
    let added=0, skipped=0;
    for(const row of rows){
      const name=(row['Name']||row['name']||row['Player']||'').toString().trim();
      const iplTeam=(row['IPL Team']||row['IPLTeam']||row['Team']||'').toString().trim();
      const role=(row['Role']||row['role']||'').toString().trim();
      // Owner team: from xlsx column OR default to currently selected team
      const ownerTeam=(row['Owner Team']||row['OwnerTeam']||row['Owner']||'').toString().trim()||t?.name||'Unassigned';
      if(!name){skipped++;continue;}
      if(S.squad.some(p=>p.name.toLowerCase()===name.toLowerCase()&&p.ownerTeam===ownerTeam)){skipped++;continue;}
      const teamSquad=S.squad.filter(p=>p.ownerTeam===ownerTeam);
      if(teamSquad.length>=25){skipped++;continue;}
      S.squad.push({id:gid(),name,iplTeam,role,ownerTeam});
      added++;
    }
    await saveS();render();
    alert(`✅ Imported ${added} players to ${t?.name||'squad'}. ${skipped} skipped.`);
  }catch(e){
    alert('Import failed: '+e.message);
  }
}

const FORMATION = { Batsman:4, 'All-rounder':2, 'Wicket-keeper':1, Bowler:4 };
const FLEX_ROLES = {
  'All-rounder': ['Batsman','Bowler','All-rounder'],
  'Wicket-keeper': ['Batsman','Wicket-keeper']
};

/* Flexible formation validator.
   AR can fill AR / BAT / BOWL slots. WK can fill WK / BAT slots.
   Algorithm: assign most-constrained slots first, then flex remaining. */
function solveFormation(players) {
  const byRole = { Batsman:0, Bowler:0, 'All-rounder':0, 'Wicket-keeper':0 };
  let os = 0;
  for (const p of players) {
    if (byRole[p.role] !== undefined) byRole[p.role]++;
    const sq = (S.squad||[]).find(s => s.name === p.name);
    if (sq?.isOverseas) os++;
  }
  const nBat = byRole['Batsman'], nBowl = byRole['Bowler'];
  const nAR = byRole['All-rounder'], nWK = byRole['Wicket-keeper'];

  // Slots to fill
  const need = { Batsman:FORMATION['Batsman'], Bowler:FORMATION['Bowler'],
                 'All-rounder':FORMATION['All-rounder'], 'Wicket-keeper':FORMATION['Wicket-keeper'] };

  // 1. WK slot — only WK players can fill
  const wkForWK = Math.min(nWK, need['Wicket-keeper']);
  const wkLeft = nWK - wkForWK; // remaining WK players (can flex to BAT)
  const wkShort = need['Wicket-keeper'] - wkForWK;

  // 2. AR slot — only AR players can fill
  const arForAR = Math.min(nAR, need['All-rounder']);
  const arLeft = nAR - arForAR; // remaining AR players (can flex to BAT or BOWL)
  const arShort = need['All-rounder'] - arForAR;

  // 3. BAT slot — pure BAT first, then flex WK, then flex AR
  let batStill = need['Batsman'];
  const batForBat = Math.min(nBat, batStill); batStill -= batForBat;
  const wkForBat = Math.min(wkLeft, batStill); batStill -= wkForBat;
  const wkFlex = wkLeft - wkForBat;
  const arForBat = Math.min(arLeft, batStill); batStill -= arForBat;
  const arAfterBat = arLeft - arForBat;

  // 4. BOWL slot — pure BOWL first, then remaining flex AR
  let bowlStill = need['Bowler'];
  const bowlForBowl = Math.min(nBowl, bowlStill); bowlStill -= bowlForBowl;
  const arForBowl = Math.min(arAfterBat, bowlStill); bowlStill -= arForBowl;

  // Build assigned counts (how many fill each SLOT)
  const assigned = {
    'Wicket-keeper': wkForWK,
    'All-rounder': arForAR,
    Batsman: batForBat + wkForBat + arForBat,
    Bowler: bowlForBowl + arForBowl
  };

  // Errors
  const errors = [];
  if (wkShort > 0) errors.push(`Need ${need['Wicket-keeper']} Wicket-keeper(s), have ${nWK}`);
  if (arShort > 0) errors.push(`Need ${need['All-rounder']} All-rounder(s), have ${nAR}`);
  if (batStill > 0) errors.push(`Need ${need['Batsman']} in Batsman slots, can only fill ${assigned['Batsman']} (BAT/AR/WK)`);
  if (bowlStill > 0) errors.push(`Need ${need['Bowler']} in Bowler slots, can only fill ${assigned['Bowler']} (BOWL/AR)`);
  if (os > MAX_OVERSEAS) errors.push(`Max ${MAX_OVERSEAS} overseas, have ${os}`);

  return { assigned, byRole, errors, overseas: os };
}

function validateFormation(players) {
  return solveFormation(players).errors;
}

function formationStatus(players) {
  const s = solveFormation(players);
  // Return assigned slot counts + overseas + raw role counts for display
  return { ...s.assigned, _overseas: s.overseas, _raw: s.byRole };
}

async function addToXI(tid){
  if(!checkAdmin('add to XI')) return;
  const t=S.teams.find(x=>x.id===tid);if(!t)return;
  const sel=document.getElementById('pxi-player');
  const name=sel?.value;
  if(!name){alert('Select a player');return;}
  const isCap=document.getElementById('pxi-cap')?.checked;
  const isVc=document.getElementById('pxi-vc')?.checked;
  if(t.players.length>=11){alert('XI already has 11 players. Remove one first.');return;}
  const sqPlayer=(S.squad||[]).find(p=>p.name===name&&p.ownerTeam===t.name);
  if(!sqPlayer){alert('Player not found in squad');return;}
  // Overseas check
  if(sqPlayer.isOverseas){
    const curOS=t.players.reduce((n,p)=>{const sq=(S.squad||[]).find(s=>s.name===p.name);return n+(sq?.isOverseas?1:0);},0);
    if(curOS>=MAX_OVERSEAS){alert(`Max ${MAX_OVERSEAS} overseas players allowed.`);return;}
  }
  // Flexible formation check — simulate adding and validate
  const tempPlayers=[...t.players,{name:sqPlayer.name,role:sqPlayer.role}];
  if(tempPlayers.length===11){
    const errs=validateFormation(tempPlayers);
    if(errs.length){alert(`Formation invalid:\n${errs.join('\n')}`);return;}
  }
  t.players.push({id:gid(),name:sqPlayer.name,iplTeam:sqPlayer.iplTeam,role:sqPlayer.role});
  if(isCap||!t.currentCaptain) t.currentCaptain=name;
  if(isVc||(!t.currentVc&&t.currentCaptain!==name)) t.currentVc=name;
  await saveS();closeModal('pick-xi-modal');showPickXI(tid);render();
}

async function removeFromXI(tid,name){
  if(!checkAdmin('remove from XI')) return;
  const t=S.teams.find(x=>x.id===tid);if(!t)return;
  t.players=t.players.filter(p=>p.name!==name);
  if(t.currentCaptain===name)t.currentCaptain=t.players[0]?.name||null;
  if(t.currentVc===name)t.currentVc=t.players[1]?.name||t.players[0]?.name||null;
  await saveS();render();
}

function getMatchDates() {

  }
  return map;
}

async function logSwap(tid){
  if(!checkAdmin('log a swap')) return;
  const t=S.teams.find(x=>x.id===tid);if(!t)return;
  const type=document.getElementById('sw-type')?.value;
  const from=document.getElementById('sw-from')?.value;
  const to=(type==='player'
    ? document.getElementById('sw-to-select')?.value
    : document.getElementById('sw-to-role')?.value);
  const mid=document.getElementById('sw-match')?.value;
  const isWrong=document.getElementById('sw-wrong')?.checked;
  if(!to){alert(type==='player'?'Select a player to swap in':'Select the new captain/VC');return;}
  if(!t.swaps)t.swaps={player:0,captain:0,vc:0,history:[]};

  const todayStr=new Date().toISOString().split('T')[0];
  const matchDate=S.matches.find(m=>m.id===mid)?.date||todayStr;

  // Formation check for non-wrong player swaps
  if(type==='player' && !isWrong){
    const outPlayer=t.players.find(p=>p.name===from);
    const inPlayer=(S.squad||[]).find(p=>p.name===to&&p.ownerTeam===t.name);
    const newRole=inPlayer?.role||outPlayer?.role;
    if(!newRole){alert('Could not determine role for incoming player.');return;}
    const tempPlayers=t.players.filter(p=>p.name!==from).concat([{name:to,role:newRole}]);
    const errs=validateFormation(tempPlayers);
    if(errs.length){
      const proceed=confirm(`⚠️ Formation warning:\n${errs.join('\n')}\n\nThis will be marked as a WRONG swap (−200 pts). Proceed?`);
      if(!proceed)return;
      document.getElementById('sw-wrong').checked=true;
    }
  }

  const isWrongFinal=document.getElementById('sw-wrong')?.checked;

  // Check season limits (wrong swaps also count against limits)
  const limits={player:25,captain:7,vc:7};
  if((t.swaps[type]||0)>=limits[type]){
    alert(`No ${type} swaps remaining this season! (${limits[type]} max)`);return;
  }
  t.swaps[type]=(t.swaps[type]||0)+1;

  const mname=S.matches.find(m=>m.id===mid)?.name||'Next match';
  const outPlayer=t.players.find(p=>p.name===from);
  const inPlayer=(S.squad||[]).find(p=>p.name===to&&p.ownerTeam===t.name);
  const newRole=inPlayer?.role||outPlayer?.role||'';

  t.swaps.history.push({type,from,to,match:mname,matchId:mid,matchDate,isWrong:isWrongFinal,date:new Date().toISOString(),newRole});

  if(!isWrongFinal){
    if(type==='player'){
      t.players=t.players.filter(p=>p.name!==from);
      t.players.push({id:gid(),name:to,iplTeam:inPlayer?.iplTeam||outPlayer?.iplTeam||'',role:newRole});
      if(t.currentCaptain===from)t.currentCaptain=to;
      if(t.currentVc===from)t.currentVc=to;
    } else if(type==='captain'){t.currentCaptain=to;}
    else if(type==='vc'){t.currentVc=to;}
  }
  await saveS();closeModal('swap-modal');render();
}

async function savePred(tid,mid){
  if(!checkAdmin('save a prediction')) return;
  const el=document.getElementById(`pi-${tid}-${mid}`);
  const pred=el?.value?.trim();
  if(!pred||pred===''){alert('Select a team to predict');return;}
  const m=S.matches.find(x=>x.id===mid);
  const todayStr=new Date().toISOString().split('T')[0];
  if(m?.date && m.date !== todayStr){alert('Predictions can only be saved for today\'s matches.');return;}
  if(m?.completed){alert('Match already completed — prediction cannot be saved.');return;}
  const t=S.teams.find(x=>x.id===tid);if(!t)return;
  if(!t.predictions)t.predictions={};
  t.predictions[mid]={prediction:pred,savedAt:new Date().toISOString()};
  await saveS();render();
}

      </div>`).join('')}

    <div class="sep"></div>
    <div class="fg"><label>Match Total Override <span class="muted small">(leave blank to auto-sum from player pts above)</span></label>
      <input id="es-total" type="number" placeholder="Auto-calculated" value="" style="width:140px"/>
    </div>

    <div class="fc g8 mt12">
      <button class="btn btn-primary" onclick="saveEditedScores('${matchId}','${teamId}')">💾 Save Override</button>
      <button class="btn btn-ghost" onclick="closeModal('edit-score-modal')">Cancel</button>
    </div>
    ${overrideLog}`);
}

async function saveEditedScores(matchId, teamId){
  const note=document.getElementById('es-note')?.value.trim();
  if(!note){alert('⚠️ A reason/note is required before saving an override.');return;}

  const m=S.matches.find(x=>x.id===matchId);
  const scores=m?.teamScores?.[teamId];
  if(!scores) return;

  const oldTotal=scores.total;

  // Update player pts
  for(const p of (scores.players||[])){
    const inp=document.getElementById(`ep-${p.name.replace(/[^a-zA-Z0-9]/g,'_')}`);
    if(inp){const v=parseInt(inp.value);if(!isNaN(v))p.pts=v;}
  }

  // Total: manual override takes priority, else auto-sum
  const totalInp=document.getElementById('es-total');
  const manualTotal=totalInp?.value.trim()!==''?parseInt(totalInp.value):NaN;
  scores.total=!isNaN(manualTotal)?manualTotal:(scores.players||[]).reduce((a,p)=>a+p.pts,0);

  // Store override audit log
  if(!scores.overrides) scores.overrides=[];
  scores.overrides.push({
    date:new Date().toLocaleString(),
    oldTotal,
    newTotal:scores.total,
    note
  });

  await saveS();closeModal('edit-score-modal');render();
  alert(`✅ Scores updated for ${S.teams.find(t=>t.id===teamId)?.name}. New total: ${scores.total}`);
}

async function reverseSwap(tid, swapIdx){
  if(!checkAdmin('reverse a swap')) return;
  const t=S.teams.find(x=>x.id===tid);if(!t)return;
  const h=t.swaps?.history;if(!h||swapIdx<0||swapIdx>=h.length)return;
  const sw=h[swapIdx];
  if(!confirm(`Reverse swap: ${sw.from||sw.type} → ${sw.to}?\nThis will undo the roster change and refund the swap.`)) return;
  if(!sw.isWrong){
    if(sw.type==='player'){
      t.players=t.players.filter(p=>p.name!==sw.to);
      if(sw.from) t.players.push({id:gid(),name:sw.from,iplTeam:'',role:sw.outRole||''});
    } else if(sw.type==='captain'){t.currentCaptain=sw.from||t.currentCaptain;}
    else if(sw.type==='vc'){t.currentVc=sw.from||t.currentVc;}
    if(!sw.isFree && t.swaps[sw.type]>0) t.swaps[sw.type]--;
  }
  h.splice(swapIdx,1);
  await saveS();render();
  alert('✅ Swap reversed.');
}

async function reversePred(tid, mid){
  if(!checkAdmin('reverse a prediction')) return;
  const t=S.teams.find(x=>x.id===tid);if(!t)return;
  if(!t.predictions?.[mid]){alert('No prediction found.');return;}
  if(!confirm('Clear this prediction?')) return;
  delete t.predictions[mid];
  await saveS();render();
}

// ── HAMBURGER / DRAWER ──
function toggleDrawer(){
  const btn=document.getElementById('hamburger-btn');
  const drawer=document.getElementById('nav-drawer');
  btn.classList.toggle('open');
  drawer.classList.toggle('open');
}
function closeDrawer(){
  document.getElementById('hamburger-btn')?.classList.remove('open');
  document.getElementById('nav-drawer')?.classList.remove('open');
}
function navDrawer(btn){
  nav(btn.dataset.v);
  closeDrawer();
}

// Sync active state to drawer buttons
function syncDrawerActive(v){
  document.querySelectorAll('#nav-drawer-inner button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
}

document.getElementById('nav').addEventListener('click',e=>{
  const btn=e.target.closest('[data-v]');if(btn)nav(btn.dataset.v);
});

(async()=>{
  const app=document.getElementById('app');
  app.innerHTML='<div class="empty"><div class="spinner" style="width:32px;height:32px;border-width:3px"></div><p class="muted mt12">Connecting to database…</p></div>';
  await loadS();
  const ind=document.getElementById('sync-indicator');
  if(ind){ ind.textContent='●'; ind.className='badge b-green'; ind.title='Connected to Firebase'; }
  render();
})();
</script>
